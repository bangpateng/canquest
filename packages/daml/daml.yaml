sdk-version: 3.4.11
# ============================================================
# CanQuest DAML Package — canquest-v22 (LEAN + ATOMIC SETTLE)
# Version: 1.0.0
# SDK: 3.4.11 (Canton Network)
#
# ARSITEKTUR v22 (menggantikan v21 yang dead code):
#   3 template (custodial operator pattern):
#     1. WalletRegistration — jangkar identitas on-chain
#     2. QuestCampaign      — kuota FCFS/Raffle + state machine
#     3. QuestClaimReceipt  — receipt + atomic Settle (nested CIP-56)
#
# BREAKING CHANGE vs v21 (→ rename package, fresh start):
#   - QuestClaim → QuestClaimReceipt (rename template)
#   - AtomicFeeAndReward choice → Settle (nested TransferFactory_Transfer)
#   - RevealRewardCode → RevealCode
#   - UpdateCampaignStatus dipecah: Activate / Pause / EndCampaign
#   - CloseCampaign → Close (consuming = archive, final state)
#   - Tambah: RecordTxId (post-settle, isi tx id dari backend)
#   - Tambah field: rewardToken ("CC" | "USDCx")
#
# ATOMICITY (quest reward claim):
#   Settle = nested sub-exercise di 1 transaction tree:
#     - TransferFactory_Transfer (fee: user → treasury)
#     - TransferFactory_Transfer (reward: rewardParty → user)
#     - FeaturedAppRight_CreateActivityMarker (optional, bila FAR on)
#   actAs command = [operator, userAddress, rewardParty] (+ appProvider bila FAR on)
#
# DAR DATA-DEPENDENCIES (BUKAN dependencies — Splice DAR bukan SDK pkg):
#   Taruh file DAR di packages/daml/dars/ (extract dari participant node).
#   Lihat README.md cara extract.
# ============================================================
name: canquest-v22
source: daml
version: 1.0.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  # Nama file aktual dari bundle splice-node v0.5.0 (lihat scripts/fetch-daml-deps.sh).
  # Canton AI: path file bebas, tidak harus match nama simbolik.
  - dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - dars/splice-api-token-holding-v1-current.dar
  - dars/splice-api-token-metadata-v1-1.0.0.dar
  # FAR marker — versi disesuaikan setelah cek bundle (v1/v2/current).
  # Sementara comment; aktifkan setelah dapat nama file tepat.
  # - dars/splice-api-featured-app-vX.dar
