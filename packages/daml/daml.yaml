sdk-version: 3.4.11
# ============================================================
# CanQuest DAML Package — canquest-v27 (hybrid fee AppPaymentRequest)
# Version: 1.5.0
# SDK: 3.4.11 (Canton Network)
#
# ARSITEKTUR v27 hybrid (menggantikan v25 Settle):
#   5 template (custodial operator pattern):
#     1. WalletRegistration  — jangkar identitas on-chain
#     2. CampaignEligibility — bukti lock CC / points per campaign
#     3. QuestCampaign       — kuota FCFS/Raffle + state machine + eligibility guard
#     4. PlatformTransfer    — send token + platform fee atomic (dormant)
#     5. QuestPaymentRequest — fee-tracking wrapper utk AppPaymentRequest (FEE ONLY)
#
# ⚠️ KOREKSI v27 (1.4.0 cacat → 1.5.0 hybrid):
#   Versi 1.4.0 salah asumsi AppPaymentRequest bawa reward+fee (1 request).
#   Faktanya (verified vs docs resmi Splice docs.sync.global) AppPaymentRequest
#   adalah flow USER-BAYAR: sender=user, provider menerima usage rewards.
#   Splice tidak punya mekanisme native platform→user reward.
#   Konsekuensi:
#     • Fee claim (user→treasury) : AppPaymentRequest (locked, no preapproval)
#     • Reward (platform→user)    : CIP-56 TransferFactory_Transfer (backend, unchanged)
#     • QuestPaymentRequest: DROP field rewardAmount (cacat), jadi fee-only wrapper
#
# DAR DATA-DEPENDENCIES (BUKAN dependencies — Splice DAR bukan SDK pkg):
#   File DAR dari bundle splice-node v0.6.12 (lihat scripts/fetch-daml-deps.sh).
# ============================================================
name: canquest-v27
source: daml
version: 1.5.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  # Nama file aktual dari bundle splice-node v0.6.12 (lihat scripts/fetch-daml-deps.sh).
  # Canton AI: path file bebas, tidak harus match nama simbolik.
  # Versi HARUS match participant node (0.6.12) utk ABI compat.
  - dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - dars/splice-api-token-holding-v1-current.dar
  - dars/splice-api-token-metadata-v1-1.0.0.dar
  - dars/splice-api-featured-app-v2-1.0.0.dar
