sdk-version: 3.4.11
# ============================================================
# CanQuest DAML Package — canquest-v23 (LEAN + ATOMIC SETTLE + Optional reward)
# Version: 1.1.0
# SDK: 3.4.11 (Canton Network)
#
# ARSITEKTUR v23 (menggantikan v22):
#   3 template (custodial operator pattern):
#     1. WalletRegistration — jangkar identitas on-chain
#     2. QuestCampaign      — kuota FCFS/Raffle + state machine
#     3. QuestClaimReceipt  — receipt + atomic Settle (nested CIP-56)
#
# CHANGE vs v22 (non-breaking upgrade, fresh package krn Settle args change):
#   - Settle choice reward leg jadi Optional (utk support kode claim rewardCc=0)
#   - feeFactoryCid tetap wajib (selalu jalan)
#   - rewardFactoryCid/rewardTransfer/rewardExtraArgs = Optional (None utk kode)
#   - rewardSent = True hanya bila reward leg di-exercise (kode claim False)
#   - Kode claim path: Settle dgn reward=None → fee-only atomic → RevealCode
#     bisa jalan (feePaid=True dari Settle)
#
# ARSITEKTUR v22 (sama, carried over):
#   - Settle = nested sub-exercise di 1 transaction tree (atomic)
#   - actAs = [operator, userAddress, rewardParty] (+ appProvider bila FAR on)
#   - DAML boundary: quest logic only; wallet ops pure CIP-56
#
# DAR DATA-DEPENDENCIES (BUKAN dependencies — Splice DAR bukan SDK pkg):
#   File DAR dari bundle splice-node v0.6.12 (lihat scripts/fetch-daml-deps.sh).
# ============================================================
name: canquest-v27
source: daml
version: 1.4.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  # Nama file aktual dari bundle splice-node v0.6.12 (lihat scripts/fetch-daml-deps.sh).
  # Canton AI: path file bebas, tidak harus match nama simbolik.
  # Versi HARUS match participant node (0.6.12) utk ABI compat.
  - dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - dars/splice-api-token-holding-v1-current.dar
  - dars/splice-api-token-metadata-v1-1.0.0.dar
  - dars/splice-api-featured-app-v2-1.0.0.dar
